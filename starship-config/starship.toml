# Filename: ~/github/dotfiles-latest/starship-config/starship-eldritch.toml
# ~/github/dotfiles-latest/starship-config/starship-eldritch.toml

# https://starship.rs/config/#git-branch

# # In case you want to modify the order of the items you can do this
# format = """
# $username\
# $hostname\
# $directory\
# $git_branch\
# $git_status\
# $git_commit\
# $git_state\
# $all\
# $time\
# $character
# """

# This will show the time on a 2nd line
# Add a "\" at the end of an item, if you want the next item to show on the same line
# Define the order of the prompt and keep them on the same line
format = """$directory$git_branch$git_status$git_commit$git_state$character"""

[battery]
disabled = true

[gcloud]
disabled = true

[time]
style = '#987afb bold'
disabled = true
format = '[\[$time\]]($style) '
# https://docs.rs/chrono/0.4.7/chrono/format/strftime/index.html
# %T	00:34:60	Hour-minute-second format. Same to %H:%M:%S.
# time_format = '%y/%m/%d %T'
time_format = '%y/%m/%d'
palette = "catppuccin_mocha"
# For this to show up correcly, you need to have cluster access
# So your ~/.kube/config needs to be configured on the local machine
[kubernetes]
disabled = false
# context = user@cluster
# format = '[$user@$cluster \($namespace\)](#949ae5) '
# format = '[$cluster \($namespace\)](#13f64d) '
# Apply separate colors for cluster and namespace
format = '[$cluster](#13f64d bold) [\($namespace\)](#37f499 bold) '
# format = 'on [⛵ ($user on )($cluster in )$context \($namespace\)](dimmed green) '
# Only dirs that have this file inside will show the kubernetes prompt
# detect_files = ['900-detectkubernetes.sh']
# detect_env_vars = ['STAR_USE_KUBE']
# contexts = [
#   { context_pattern = "dev.local.cluster.k8s", style = "green", symbol = "💔 " },
# ]

[username]
style_user = '#987afb bold'
style_root = 'white bold'
format = '[$user]($style)'
show_always = true

[hostname]
ssh_only = false
format = '[.@.](white bold)[$hostname](#37f499 bold)'

[directory]
style = '#04d1f9 bold'
truncate_to_repo = false
truncation_length = 3
format = "[$path]($style) "

[ruby]
detect_variables = []
detect_files = ['Gemfile', '.ruby-version']

# Optional: Customize the appearance of your arrow character
[character]
vicmd_symbol = "[N] >>>"
success_symbol = '[➜](bold green)'

[git_branch]
format =  '[$symbol$branch(:$remote_branch)]($style)'


[docker_context]
format = 'via [🐋 $context](blue bold)'



[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
